name: share_birds
description: "AudioShare Buds - Live mic audio streaming to Bluetooth earbuds"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Audio
  flutter_tts: ^4.2.0
  audio_session: ^0.1.21

  # Bluetooth / Audio routing
  # Uses platform channels for native AudioRecord/AudioTrack

  # Background / Foreground Service
  flutter_foreground_task: ^8.13.0

  # Permissions
  permission_handler: ^11.3.1

  # Storage
  shared_preferences: ^2.3.2

  # UI Utilities
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
